---
name: Build and Publish Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image_suffix: ""
            runtime_image: python:3.12-slim
            runtime_apt_packages: ""
            onnxruntime_package: onnxruntime
          - image_suffix: -gpu
            runtime_image: nvidia/cuda:12.9.2-cudnn-runtime-ubuntu24.04
            runtime_apt_packages: python3 python3-pip
            onnxruntime_package: onnxruntime-gpu
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PIPER_ONNXRUNTIME_PACKAGE=${{ matrix.onnxruntime_package }}
            RUNTIME_IMAGE=${{ matrix.runtime_image }}
            RUNTIME_APT_PACKAGES=${{ matrix.runtime_apt_packages }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
